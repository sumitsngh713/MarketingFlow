version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MarketingFlow Application Container (Frontend + Backend API + Worker)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketingflow-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:marketingflow_secret@postgres:5432/marketingflow?schema=public
      - JWT_SECRET=marketingflow_super_secure_jwt_secret_key_2026_xyz!
      - JWT_EXPIRES_IN=24h
      - ENCRYPTION_KEY=marketingflow_32bytes_encryption!
      - BASE_URL=http://localhost:5000
      - AUTO_SEED=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketingflow-net

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: marketingflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: marketingflow_secret
      POSTGRES_DB: marketingflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketingflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketingflow-net

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Message Broker (Optional support)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marketingflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marketingflow-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  marketingflow-net:
    driver: bridge
